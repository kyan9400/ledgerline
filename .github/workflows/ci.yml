name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: ledger_test
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_test" --health-interval 5s --health-retries 20
      kafka:
        image: apache/kafka:4.4.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports: ["9092:9092"]
        options: >-
          --health-cmd "nc -z localhost 9092" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: The payments service's test database
        run: PGPASSWORD=ledger psql -h 127.0.0.1 -U ledger -d ledger_test -c 'CREATE DATABASE payments_test'
      - name: Build and test (unit, API, concurrency, property, outbox and recovery tests against PostgreSQL and Kafka)
        env:
          LEDGERLINE_TEST_DB: jdbc:postgresql://127.0.0.1:5432
          LEDGERLINE_TEST_KAFKA: localhost:9092
        run: ./gradlew --no-daemon --console=plain build
      - name: The integration tests ran (not skipped)
        run: |
          check() {
            f="$1/build/test-results/test/TEST-dev.ledgerline.$2.xml"
            grep -q 'tests="[1-9]' "$f" && ! grep -q '<skipped' "$f"
          }
          for t in PropertyTest ConcurrencyTest ApiTest OutboxTest; do check ledger "ledger.$t"; done
          for t in CardPaymentsTest PayoutsTest RecoveryTest; do check payments "payments.$t"; done

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: for t in ledger payments otherbank checker; do docker build --target $t -t ledgerline-$t:ci .; done
      - name: They run as a non-root user
        run: for t in ledger payments otherbank checker; do test "$(docker inspect -f '{{.Config.User}}' ledgerline-$t:ci)" = "10001:10001"; done
