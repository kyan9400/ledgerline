# The public, read-only demo, on top of compose.yaml (and chaos.yaml): for a host where another Compose
# project's proxy owns ports 80/443. The dashboard joins that proxy's network, where it is
# ledgerline-web:80; its site block is then just:
#
#   ledgerline.example.com { reverse_proxy ledgerline-web:80 }
#
#   docker network create edge        # once
#   docker compose -f deploy/compose.yaml -f deploy/chaos.yaml -f deploy/compose.edge.yaml --env-file deploy/.env up -d
#
# Public: the analytics dashboard, and Grafana under /grafana/ for anonymous viewers (the dashboard's
# Caddy closes its login and admin APIs). The APIs that move money stay on the internal network.
services:
  dashboard:
    networks:
      internal: {}
      edge:
        aliases: [ledgerline-web]

  grafana:
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost:18300}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # No sign-in on a public page (the dashboards come from files; the admin has the API, by tunnel).
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

  prometheus:
    # Anyone may run a dashboard's queries now: keep each one small.
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
      - --query.timeout=20s
      - --query.max-samples=5000000

  # Shoppers, so the charts look like a shop's day: the fraud simulator's customers (six of them, about a
  # payment every ten seconds between them) at eight merchants, and now and then a stolen card (card
  # testing, a takeover, a single large hit) for the scorer to catch. Hour-long runs, a new seed each;
  # the disk is small and shared, so below 1.5 GB free it waits instead.
  #
  # A stolen card every 20 minutes leaves about 4% of the attempts fraud (3% of payments declined as
  # such, over six hours): far more than a real platform sees, but a demo at real-world rates would show
  # an empty fraud panel all day. Measured
  # against the simulator's truth at one episode every 5 minutes (eval/demo/fraud-live.json): 78.8% of
  # fraud attempts blocked, 0.45% of genuine payments declined, 98.4% of the declines really fraud.
  demo-shoppers:
    image: ledgerline-fraud:${LEDGERLINE_VERSION:-latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          free=$$(df -m / | awk 'NR==2 {print $$4}')
          if [ "$$free" -gt 1500 ]; then
            SEED=$$(date +%s) python -m fraud.sim > /dev/null 2>&1
          else
            echo "$$(date) only $$free MB free: waiting"; sleep 600
          fi
        done
    cpus: 0.25
    mem_limit: 192m
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      PAYMENTS: http://payments:8080
      LEDGER: http://ledger:8080
      MINUTES: "60"
      CUSTOMERS: "6"
      MERCHANTS: "8"
      EPISODE_EVERY_S: "1200"
      OUT: /tmp/truth.jsonl
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      payments: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  # The rest of what the dashboard shows: payouts to the other bank, refunds, voids, in a trickle (a
  # flow every 20 s or so), in hour-long runs, waiting too when the disk is low.
  demo-traffic:
    image: ledgerline-checker:${LEDGERLINE_VERSION:-latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          free=$$(df -m / | awk 'NR==2 {print $$4}')
          if [ "$$free" -gt 1500 ]; then
            DURATION_S=3600 RATE=$${DEMO_RATE:-0.05} DEADLINE_S=60 /app/bin/checker workload /tmp/demo.json > /dev/null 2>&1
          else
            echo "$$(date) only $$free MB free: waiting"; sleep 600
          fi
        done
    cpus: 0.25
    mem_limit: 256m
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      PAYMENTS: http://payments:8080
      LEDGER: http://ledger:8080
      CUSTOMERS: "20"
      MERCHANTS: "4"
    depends_on:
      payments: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

networks:
  edge:
    external: true
    name: edge
