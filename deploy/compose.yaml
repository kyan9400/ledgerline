# Ledgerline on one host.
#
#   cp deploy/.env.example deploy/.env    # then set the passwords
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
#   docker compose -f deploy/compose.yaml --env-file deploy/.env run --rm checker   # rebuild the books from Kafka
#
# Nothing is published on the host's ports but the dashboards' (Grafana and the analytics dashboard), on
# its loopback only: reach them through an SSH tunnel.
#
# Observability: the services send traces to Tempo (a share of requests, TRACING_SAMPLING; 0.1 by
# default) and are scraped by Prometheus, which evaluates the alerts (observability/alerts.yaml) and sends
# what fires to Alertmanager. Grafana shows it all: ssh -L 18300:127.0.0.1:18300 <host>, then
# http://localhost:18300 (anonymous viewers; admin's password is GRAFANA_ADMIN_PASSWORD).
name: ledgerline

x-labels: &labels
  com.centurylinklabs.watchtower.enable: "false"

x-hardened: &hardened
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:18.6-alpine
    cpus: 1.0
    mem_limit: 768m
    restart: unless-stopped
    labels: *labels
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set PAYMENTS_DB_PASSWORD in deploy/.env}
    command: ["-c", "max_connections=100", "-c", "shared_buffers=192MB",
              "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all",
              # The WAL kept at most 256 MB (the default, 1 GB, is a lot of a small disk).
              "-c", "max_wal_size=256MB", "-c", "min_wal_size=64MB"]
    volumes:
      - pg_data:/var/lib/postgresql
      # On first start: the payments service's database and role (it can't touch the ledger's).
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-payments.sh:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  # One broker in KRaft mode (no ZooKeeper). Kafka carries the services' events to consumers; the
  # source of truth stays in PostgreSQL.
  kafka:
    image: apache/kafka:4.4.0
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped
    labels: *labels
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # On the volume (the image's default is under /tmp, inside the container).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Kept by size, not age: at most 150 MB a partition (the disk here is small).
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_LOG_RETENTION_BYTES: 157286400
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [internal]

  ledger:
    image: ledgerline-ledger:${LEDGERLINE_VERSION:-latest}
    build:
      context: ..
      target: ledger
    cpus: 1.0
    mem_limit: 512m
    restart: unless-stopped
    labels: *labels
    environment:
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGER_AUDIT_EVERY: ${LEDGER_AUDIT_EVERY:-10m}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.1}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    <<: *hardened
    networks: [internal]

  payments:
    image: ledgerline-payments:${LEDGERLINE_VERSION:-latest}
    build:
      context: ..
      target: payments
    cpus: 1.0
    mem_limit: 512m
    restart: unless-stopped
    labels: *labels
    environment:
      PAYMENTS_DB_URL: jdbc:postgresql://postgres:5432/payments
      PAYMENTS_DB_USER: payments
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      LEDGER_URL: http://ledger:8080
      OTHERBANK_URL: http://otherbank:8090
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRAUD_URL: http://fraud:8000
      FRAUD_MODE: ${FRAUD_MODE:-shadow}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.1}
    depends_on:
      postgres: { condition: service_healthy }
      ledger: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    <<: *hardened
    networks: [internal]

  # The fraud scorer: features from payments.events (rebuilt from the topic on start), a LightGBM model
  # from the fraud_model volume (python -m fraud.train writes it; without one, rules decide). The payments
  # service asks it before a card payment's money moves, and goes on without it if it doesn't answer.
  fraud:
    image: ledgerline-fraud:${LEDGERLINE_VERSION:-latest}
    build:
      context: ../fraud
    cpus: 1.0
    mem_limit: 512m
    restart: unless-stopped
    labels: *labels
    environment:
      KAFKA: kafka:9092
      PYTHONDONTWRITEBYTECODE: "1"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    volumes:
      - fraud_model:/model:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s
    <<: *hardened
    networks: [internal]

  # Analytics: reads both topics through its Kafka engine (deploy/clickhouse/init.sql). The dashboard
  # reaches it only through its fixed, read-only endpoints (api.xml), as the dashboard user.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    cpus: 1.0
    mem_limit: 1536m
    restart: unless-stopped
    labels: *labels
    environment:
      CLICKHOUSE_USER: ledgerline
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/.env}
      CLICKHOUSE_DASHBOARD_PASSWORD: ${CLICKHOUSE_DASHBOARD_PASSWORD:?set CLICKHOUSE_DASHBOARD_PASSWORD in deploy/.env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/server.xml:/etc/clickhouse-server/config.d/ledgerline.xml:ro
      - ./clickhouse/api.xml:/etc/clickhouse-server/config.d/api.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/dashboard.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  # The dashboard (Vue, served by Caddy, which forwards only its endpoints to ClickHouse). On the host's
  # loopback only: reach it with an SSH tunnel (ssh -L 18480:127.0.0.1:18480 <host>).
  dashboard:
    image: ledgerline-dashboard:${LEDGERLINE_VERSION:-latest}
    build:
      context: ../dashboard
    cpus: 0.5
    mem_limit: 128m
    restart: unless-stopped
    labels: *labels
    environment:
      CLICKHOUSE_DASHBOARD_PASSWORD: ${CLICKHOUSE_DASHBOARD_PASSWORD}
    ports: ["127.0.0.1:18480:80"]
    depends_on:
      clickhouse: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp", "/data", "/config"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [internal]

  # The simulated other bank payouts go to. By default it misbehaves a little: 5% of answers fail,
  # 5% come after the caller has given up, 2% of payouts are returned after acceptance.
  otherbank:
    image: ledgerline-otherbank:${LEDGERLINE_VERSION:-latest}
    build:
      context: ..
      target: otherbank
    cpus: 0.5
    mem_limit: 192m
    restart: unless-stopped
    labels: *labels
    environment:
      FAIL_RATE: ${OTHERBANK_FAIL_RATE:-0.05}
      SLOW_RATE: ${OTHERBANK_SLOW_RATE:-0.05}
      RETURN_RATE: ${OTHERBANK_RETURN_RATE:-0.02}
      JOURNAL: /data/journal.jsonl
    volumes:
      - otherbank_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 4
    <<: *hardened
    networks: [internal]

  # --- Observability -----------------------------------------------------------------------------------

  # Traces, 24 hours of them (observability/tempo.yaml); its service graph goes to Prometheus.
  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yaml"]
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    labels: *labels
    user: "10001:10001"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  # Metrics and the alert rules: 15 days or 1 GB of them, whichever is less.
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    labels: *labels
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 4
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml", "--storage.path=/alertmanager"]
    cpus: 0.25
    mem_limit: 64m
    restart: unless-stopped
    labels: *labels
    volumes:
      - ./observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  # Dashboards, traces and alerts in one place; everything provisioned from observability/grafana.
  grafana:
    image: grafana/grafana:13.3.0
    cpus: 0.5
    mem_limit: 384m
    restart: unless-stopped
    labels: *labels
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports: ["127.0.0.1:18300:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  # A tool, not a service: docker compose run --rm checker
  checker:
    image: ledgerline-checker:${LEDGERLINE_VERSION:-latest}
    build:
      context: ..
      target: checker
    profiles: [tools]
    labels: *labels
    environment:
      KAFKA: kafka:9092
      LEDGER_DB: jdbc:postgresql://postgres:5432/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PAYMENTS_DB: jdbc:postgresql://postgres:5432/payments
      PAYMENTS_DB_USER: payments
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ledgerline
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    <<: *hardened
    networks: [internal]

volumes:
  pg_data:
  kafka_data:
  otherbank_data:
  fraud_model:
  ch_data:
  tempo_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  internal:
