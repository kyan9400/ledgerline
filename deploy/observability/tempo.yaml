# Tempo, in one process: traces over OTLP/HTTP from the services, kept 24 hours on the local disk. Its
# metrics generator draws the service graph (who calls whom, how often, how slowly, how often failing)
# from the spans, and writes it to Prometheus, where Grafana's service map reads it.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      # A call to something that sends no spans of its own (the simulated bank, merchants' webhook
      # endpoints) still shows, as a node named by the caller's peer.service.
      peer_attributes: [peer.service, db.name, db.system]
      enable_virtual_node_label: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs]
