spring:
  application:
    name: ledger
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: ${LEDGER_DB_POOL:16}
      connection-timeout: 2000
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful
  server-header: ""

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      probes:
        enabled: true
  # Traces: a share of requests sampled here (the services it calls follow this decision), sent over OTLP
  # when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (deploy/compose.yaml: to Tempo).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  opentelemetry:
    resource-attributes:
      service.namespace: ledgerline
  # Metrics are scraped by Prometheus (/actuator/prometheus), not pushed.
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    # Latency histograms with a bucket at each SLO boundary (the alerts count requests over 1 s); a
    # sampled request's trace id rides along as an exemplar.
    distribution:
      slo:
        http.server.requests: 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s
        http.client.requests: 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s
        grpc.server: 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s

ledger:
  # The audit of the books, on a schedule (its result is a metric, and an alert).
  audit:
    every: ${LEDGER_AUDIT_EVERY:10m}

# Load shedding (dev.ledgerline.platform.Admission): requests in flight at most, and how long the next may
# wait for a place.
admission:
  max-in-flight: ${LEDGER_MAX_IN_FLIGHT:32}
  wait-ms: 200

# The outbox relay sends every event to Kafka (off when no bootstrap servers are set).
outbox:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
  topics: ledger.events
  partitions: 6
